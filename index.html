const latestUpdate={title:'Our First Live Update!',date:'November 20, 2026',summary:'The Resonance Living Universe Archive is officially online! This marks the beginning of an evolving encyclopedia documenting the creation of an original science-fantasy saga.'};const content={version:'0.1',updated:'November 20, 2026',intro:'A living archive of an original science-fantasy universe. Explore its people, civilizations, worlds, mysteries, and the ideas connecting them.',sections:[{id:'characters',name:'Characters',description:'The lives and choices shaping the galaxy.',entries:[{name:'Kai',subtitle:'The Wanderer',body:'Raised on Eshara, Kai is drawn toward the forbidden Scar and discovers an ancient artifact. His journey eventually reaches questions of connection, consciousness, and the A’Ta.',status:'Working summary — awaiting detailed approval'},{name:'Iris',subtitle:'A life shaped by secrets',body:'Raised in a controlled environment, Iris begins questioning the world she has been shown. Her origins and unusual adaptability are central to larger mysteries.',status:'Working summary — awaiting detailed approval'},{name:'Soren',subtitle:'A separate path',body:'A childhood companion of Iris whose path diverges from hers. His evolving role in the wider story remains under development.',status:'Working summary — awaiting detailed approval'}]},{id:'factions',name:'Factions',description:'Civilizations, power, and competing visions.',entries:[{name:'The A’Ta / Architects',subtitle:'Ancient seekers',body:'An ancient civilization whose pursuit of transcendence intersects with the deepest mysteries of Resonance.',status:'Terminology and details awaiting approval'},{name:'The Federation',subtitle:'Galactic governance',body:'A political order that emerged after an earlier imperial age. Its history continues to shape the galaxy.',status:'Working summary — awaiting detailed approval'},{name:'The Demons',subtitle:'Power and conquest',body:'A formidable civilization with a culture built around strength, status, and conquest.',status:'Working summary — awaiting detailed approval'}]},{id:'worlds',name:'Worlds & Species',description:'Places and forms of life across the galaxy.',entries:[{name:'Eshara',subtitle:'The living world',body:'A living planet whose native inhabitants are profoundly connected to it. Prolonged separation can be fatal to them, making Kai’s potential departure extraordinary.',status:'Working summary — awaiting detailed approval'}]},{id:'technology',name:'Technology & Artifacts',description:'The extraordinary and the everyday.',entries:[{name:'FTL Transit',subtitle:'Crossing interstellar distances',body:'A developing faster-than-light transit system with a darkened cockpit, fleeting white streaks, and luminous silver-blue web-like visual effects.',status:'Working summary — awaiting detailed approval'},{name:'The Artifact',subtitle:'A mysterious discovery',body:'An ancient pyramid-like object discovered by Kai within ruins near the Scar. Its nature and limitations are part of the developing story.',status:'Working summary — awaiting detailed approval'}]},{id:'philosophy',name:'Philosophy & Cosmology',description:'The ideas beneath the adventure.',entries:[{name:'Understanding and Connection',subtitle:'A central theme',body:'Understanding something is not the same as being connected to it. Resonance explores the difference between knowledge of existence and lived participation in it.',status:'Working thematic statement'},{name:'Transcendence and the Birth of Universes',subtitle:'Major ending revelation',body:'In the current envisioned ending, Kai connects the A’Ta to Resonance. Their consciousness transcends, shedding individuality and giving rise to a new universe. Universes themselves are born from consciousness that transcended in prior universes: life is a way for the universe to experience itself.',status:'Planned ending — details remain unwritten',spoiler:true}]},{id:'timeline',name:'Story & Timeline',description:'Events, arcs, and future possibilities.',entries:[{name:'The Scar',subtitle:'Opening sequence',body:'Young Kai explores the forbidden Scar on Eshara, falls into an ancient bunker, and encounters a mysterious artifact.',status:'Working opening sequence'},{name:'The Greater Journey',subtitle:'Plot in development',body:'The connecting narrative bringing the protagonists together is still being outlined. This archive will expand as the story develops.',status:'Not yet established'}]}]};
let section='home',query='',detail=null,spoilers=false;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nav(){ $('#nav').innerHTML=[['home','Home'],['characters','Characters'],['factions','Factions'],['worlds','Worlds'],['technology','Technology'],['philosophy','Philosophy'],['timeline','Timeline'],['updates','What’s New']].map(([id,label])=>`<button class="${section===id?'active':''}" data-nav="${id}">${label}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;detail=null;query='';spoilers=false;render();window.scrollTo(0,0)});const toggle=$('#mobile-menu-toggle');if(toggle){toggle.onclick=()=>{const open=document.body.classList.toggle('menu-open');toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'✕ Close':'☰ Menu'};document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{document.body.classList.remove('menu-open');toggle.setAttribute('aria-expanded','false');toggle.textContent='☰ Menu'}))}}function card(e,i){return `<article class="card entry" data-entry="${i}"><span class="tag">${esc(e.status)}</span><h3>${esc(e.name)}</h3><div class="muted">${esc(e.subtitle)}</div><p>${e.spoiler?'Contains major ending spoilers.':esc(e.body.slice(0,135))+(e.body.length>135?'…':'')}</p><span class="small">Open entry →</span></article>`}function render(){nav();let html='';if(section==='home'){html=`<div class="home-v2"><section class="v2-hero"><div class="v2-hero-inner"><div class="v2-kicker">An original science-fantasy universe</div><img class="v2-symbol" src="/ata-favicon-512.png" alt="A'Ta triangle and spiral emblem"><h1 class="v2-title">RESONANCE</h1><div class="v2-subtitle">Welcome to the Resonance Vault</div><p class="v2-lead">A universe of extraordinary worlds, ancient mysteries, and the connections that shape existence.</p></div></section><div class="v2-content"><div class="v2-kicker">A living universe</div><h2>Explore the Archive</h2><p>Discover the people, civilizations, worlds, and ideas behind Resonance.</p><div class="v2-grid"><button class="v2-tile" data-go="characters"><div class="v2-kicker">✦</div><strong>Characters</strong><span>The lives and choices shaping the galaxy.</span></button><button class="v2-tile" data-go="factions"><div class="v2-kicker">◇</div><strong>Factions</strong><span>Civilizations, power, and competing visions.</span></button><button class="v2-tile" data-go="worlds"><div class="v2-kicker">◉</div><strong>Worlds & Species</strong><span>Places and forms of life across the galaxy.</span></button><button class="v2-tile" data-go="technology"><div class="v2-kicker">⬡</div><strong>Technology & Artifacts</strong><span>The extraordinary and the everyday.</span></button><button class="v2-tile" data-go="philosophy"><div class="v2-kicker">∞</div><strong>Philosophy & Cosmology</strong><span>The ideas beneath the adventure.</span></button><button class="v2-tile" data-go="timeline"><div class="v2-kicker">⌛</div><strong>Story & Timeline</strong><span>Events, arcs, and future possibilities.</span></button></div><section class="v2-latest"><div><div class="v2-kicker">Latest from the Vault</div><h2>Follow the Archive's Evolution</h2><p>Discover recent additions, changes, and developments in the Resonance universe.</p></div><button data-go="updates">View What's New →</button></section><p class="v2-note">An evolving creative archive. All lore is provisional, and nothing is final canon until the story is complete. Last archive update: November 20, 2026.</p></div></div>`}else if(section==='updates'){html=`<div class="eyebrow">Archive history</div><h1>What's New</h1><div class="card"><h3>${esc(latestUpdate.title)}</h3><p class="muted small">${esc(latestUpdate.date)}</p><p>${esc(latestUpdate.summary)}</p></div><p class="muted">Future updates will appear here so readers can quickly see what changed.</p>`}else{let s=content.sections.find(s=>s.id===section);if(detail!==null){let e=s.entries[detail];html=`<button class="back" id="back">← Back to ${esc(s.name)}</button><div class="detail"><div class="eyebrow">${esc(s.name)} / Archive entry</div><h1>${esc(e.name)}</h1><p class="lead">${esc(e.subtitle)}</p><span class="tag">${esc(e.status)}</span>${e.spoiler&&!spoilers?`<div class="notice"><strong>Major story spoilers ahead</strong><p>This entry reveals the intended conclusion and cosmology of Resonance. Continue only if you want to know the planned ending.</p><button id="reveal">Reveal ending details</button></div>`:`<div class="card" style="margin-top:25px"><p>${esc(e.body)}</p></div>`}</div>`}else{let matches=s.entries.map((e,i)=>({...e,i})).filter(e=>(e.name+' '+e.subtitle+' '+e.body).toLowerCase().includes(query.toLowerCase()));html=`<div class="eyebrow">Resonance archive</div><h1>${esc(s.name)}</h1><p class="lead">${esc(s.description)}</p><input id="search" type="search" placeholder="Search this section…" value="${esc(query)}" aria-label="Search entries"><div class="grid">${matches.map(e=>card(e,e.i)).join('')||'<p>No entries found.</p>'}</div>`}}$('#main').innerHTML=html;document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{section=e.dataset.go;render();window.scrollTo(0,0)});document.querySelectorAll('[data-entry]').forEach(e=>e.onclick=()=>{detail=+e.dataset.entry;spoilers=false;render();window.scrollTo(0,0)});if($('#back'))$('#back').onclick=()=>{detail=null;render()};if($('#reveal'))$('#reveal').onclick=()=>{spoilers=true;render()};if($('#search')){$('#search').oninput=e=>{let p=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(p,p)}}}render();
</script></body></html>
