ilization with a culture built around strength, status, and conquest.',status:'Working summary — awaiting detailed approval'}]},{id:'worlds',name:'Worlds & Species',description:'Explore extraordinary planets, ecosystems, and alien life.',entries:[{name:'Eshara',subtitle:'The living world',body:'A living planet whose native inhabitants are profoundly connected to it. Prolonged separation can be fatal to them, making Kai’s potential departure extraordinary.',status:'Working summary — awaiting detailed approval'}]},{id:'technology',name:'Technology & Artifacts',description:'Ancient relics, advanced machinery, and extraordinary inventions.',entries:[{name:'FTL Transit',subtitle:'Crossing interstellar distances',body:'A developing faster-than-light transit system with a darkened cockpit, fleeting white streaks, and luminous silver-blue web-like visual effects.',status:'Working summary — awaiting detailed approval'},{name:'The Artifact',subtitle:'A mysterious discovery',body:'An ancient pyramid-like object discovered by Kai within ruins near the Scar. Its nature and limitations are part of the developing story.',status:'Working summary — awaiting detailed approval'}]},{id:'philosophy',name:'Philosophy & Cosmology',description:'Unravel the deeper mysteries of consciousness and existence.',entries:[{name:'Understanding and Connection',subtitle:'A central theme',body:'Understanding something is not the same as being connected to it. Resonance explores the difference between knowledge of existence and lived participation in it.',status:'Working thematic statement'},{name:'Transcendence and the Birth of Universes',subtitle:'Major ending revelation',body:'In the current envisioned ending, Kai connects the A’Ta to Resonance. Their consciousness transcends, shedding individuality and giving rise to a new universe. Universes themselves are born from consciousness that transcended in prior universes: life is a way for the universe to experience itself.',status:'Planned ending — det
