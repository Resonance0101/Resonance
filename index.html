:root{color-scheme:dark;--bg:#080d17;--panel:#121d2b;--line:#2a3a4b;--text:#eaf0f5;--muted:#9aafc1;--gold:#dfc18b;--blue:#8dbdd1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 85% 0%,#1b3344 0%,transparent 38%),var(--bg);color:var(--text);font:16px/1.6 system-ui,Segoe UI,sans-serif}header{border-bottom:1px solid var(--line);padding:16px max(20px,calc((100vw - 1150px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:#09111ccf;position:sticky;top:0;backdrop-filter:blur(15px);z-index:2}.brand{letter-spacing:.25em;color:var(--gold);font-weight:750}nav{display:flex;flex-wrap:wrap;gap:8px}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:#162436;color:var(--text);padding:9px 12px;font:inherit}button:hover,button.active{border-color:var(--gold);color:var(--gold)}main{max-width:1150px;margin:auto;padding:35px 20px 80px}.eyebrow{text-transform:uppercase;letter-spacing:.2em;color:var(--gold);font-size:.73rem}h1{font-family:Georgia,serif;font-size:clamp(2.8rem,8vw,6rem);font-weight:400;line-height:1.1;margin:12px 0}h2{font-family:Georgia,serif;font-weight:400;font-size:2rem}p{color:#c7d4df}.lead{font-size:1.18rem;max-width:730px}.hero{padding:55px 0 65px;border-bottom:1px solid var(--line)}.hero-art{height:210px;border-radius:16px;margin-top:35px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 55% 115%,#6a91a2 0%,#20394d 22%,transparent 55%),radial-gradient(circle at 75% 28%,#d6dfd6 0%,#a2bac2 1%,transparent 2%),linear-gradient(125deg,#0a1726,#213a50 50%,#0a121d)}.hero-art:after{content:'✧';position:absolute;left:48%;top:5%;font-size:130px;color:#bed5e2;opacity:.45}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:22px}.card{background:linear-gradient(155deg,#152536,#0f1926);border:1px solid var(--line);border-radius:14px;padding:22px}.card h3{margin:5px 0;font-family:Georgia,serif;font-size:1.5rem;font-weight:400}.tag{display:inline-block;border:1px solid #60788a;border-radius:20px;padding:2px 9px;color:#b7d5e4;font-size:.75rem}.muted{color:var(--muted)}.hidden{display:none!important}.detail{max-width:850px}.notice{padding:18px;border:1px solid #876e49;background:#2a241e;border-radius:12px;margin:22px 0}input{background:#101c2b;color:white;border:1px solid var(--line);padding:12px;border-radius:8px;width:100%;max-width:420px}footer{border-top:1px solid var(--line);color:var(--muted);padding:30px 20px;text-align:center;font-size:.85rem}a{color:var(--blue)}.entry{cursor:pointer}.entry:hover{border-color:#7799aa}.back{margin-bottom:20px}.small{font-size:.88rem}
</style></head><body><header><div class="brand">RESONANCE</div><nav id="nav"></nav></header><main id="main"></main><footer>RESONANCE • A developing science-fantasy universe • Prototype archive v1.0 • All lore is provisional</footer><script>
const content={version:'0.1',updated:'November 20, 2026',intro:'A living archive of an original science-fantasy universe. Explore its people, civilizations, worlds, mysteries, and the ideas connecting them.',sections:[{id:'characters',name:'Characters',description:'The lives and choices shaping the galaxy.',entries:[{name:'Kai',subtitle:'The Wanderer',body:'Raised on Eshara, Kai is drawn toward the forbidden Scar and discovers an ancient artifact. His journey eventually reaches questions of connection, consciousness, and the A’Ta.',status:'Working summary — awaiting detailed approval'},{name:'Iris',subtitle:'A life shaped by secrets',body:'Raised in a controlled environment, Iris begins questioning the world she has been shown. Her origins and unusual adaptability are central to larger mysteries.',status:'Working summary — awaiting detailed approval'},{name:'Soren',subtitle:'A separate path',body:'A childhood companion of Iris whose path diverges from hers. His evolving role in the wider story remains under development.',status:'Working summary — awaiting detailed approval'}]},{id:'factions',name:'Factions',description:'Civilizations, power, and competing visions.',entries:[{name:'The A’Ta / Architects',subtitle:'Ancient seekers',body:'An ancient civilization whose pursuit of transcendence intersects with the deepest mysteries of Resonance.',status:'Terminology and details awaiting approval'},{name:'The Federation',subtitle:'Galactic governance',body:'A political order that emerged after an earlier imperial age. Its history continues to shape the galaxy.',status:'Working summary — awaiting detailed approval'},{name:'The Demons',subtitle:'Power and conquest',body:'A formidable civilization with a culture built around strength, status, and conquest.',status:'Working summary — awaiting detailed approval'}]},{id:'worlds',name:'Worlds & Species',description:'Places and forms of life across the galaxy.',entries:[{name:'Eshara',subtitle:'The living world',body:'A living planet whose native inhabitants are profoundly connected to it. Prolonged separation can be fatal to them, making Kai’s potential departure extraordinary.',status:'Working summary — awaiting detailed approval'}]},{id:'technology',name:'Technology & Artifacts',description:'The extraordinary and the everyday.',entries:[{name:'FTL Transit',subtitle:'Crossing interstellar distances',body:'A developing faster-than-light transit system with a darkened cockpit, fleeting white streaks, and luminous silver-blue web-like visual effects.',status:'Working summary — awaiting detailed approval'},{name:'The Artifact',subtitle:'A mysterious discovery',body:'An ancient pyramid-like object discovered by Kai within ruins near the Scar. Its nature and limitations are part of the developing story.',status:'Working summary — awaiting detailed approval'}]},{id:'philosophy',name:'Philosophy & Cosmology',description:'The ideas beneath the adventure.',entries:[{name:'Understanding and Connection',subtitle:'A central theme',body:'Understanding something is not the same as being connected to it. Resonance explores the difference between knowledge of existence and lived participation in it.',status:'Working thematic statement'},{name:'Transcendence and the Birth of Universes',subtitle:'Major ending revelation',body:'In the current envisioned ending, Kai connects the A’Ta to Resonance. Their consciousness transcends, shedding individuality and giving rise to a new universe. Universes themselves are born from consciousness that transcended in prior universes: life is a way for the universe to experience itself.',status:'Planned ending — details remain unwritten',spoiler:true}]},{id:'timeline',name:'Story & Timeline',description:'Events, arcs, and future possibilities.',entries:[{name:'The Scar',subtitle:'Opening sequence',body:'Young Kai explores the forbidden Scar on Eshara, falls into an ancient bunker, and encounters a mysterious artifact.',status:'Working opening sequence'},{name:'The Greater Journey',subtitle:'Plot in development',body:'The connecting narrative bringing the protagonists together is still being outlined. This archive will expand as the story develops.',status:'Not yet established'}]}]};
let section='home',query='',detail=null,spoilers=false;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nav(){ $('#nav').innerHTML=[['home','Home'],['characters','Characters'],['factions','Factions'],['worlds','Worlds'],['technology','Technology'],['philosophy','Philosophy'],['timeline','Timeline'],['updates','What’s New']].map(([id,label])=>`<button class="${section===id?'active':''}" data-nav="${id}">${label}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{section=b.dataset.nav;detail=null;query='';spoilers=false;render();window.scrollTo(0,0)})}function card(e,i){return `<article class="card entry" data-entry="${i}"><span class="tag">${esc(e.status)}</span><h3>${esc(e.name)}</h3><div class="muted">${esc(e.subtitle)}</div><p>${e.spoiler?'Contains major ending spoilers.':esc(e.body.slice(0,135))+(e.body.length>135?'…':'')}</p><span class="small">Open entry →</span></article>`}function render(){nav();let html='';if(section==='home'){html=`<div class="hero"><div class="eyebrow">The Living Universe Archive • Prototype</div><h1>RESONANCE</h1><p class="lead">${esc(content.intro)}</p><p class="muted small">Working lore, not final canon. Last archive update: ${content.updated}.</p><div class="hero-art" role="img" aria-label="Abstract starfield and luminous cosmic horizon"></div></div><h2>Explore the Archive</h2><div class="grid">${content.sections.map(s=>`<article class="card entry" data-go="${s.id}"><div class="eyebrow">Archive / ${s.entries.length} entries</div><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><span class="small">Explore →</span></article>`).join('')}</div>`}else if(section==='updates'){html=`<div class="eyebrow">Archive history</div><h1>What's New</h1><div class="card"><h3>Our First Live Update!</h3><p>The Resonance Living Universe Archive is officially online! This marks the beginning of an evolving encyclopedia documenting the creation of an original science-fantasy saga.</p></div><p class="muted">Future updates will appear here so readers can quickly see what changed.</p>`}else{let s=content.sections.find(s=>s.id===section);if(detail!==null){let e=s.entries[detail];html=`<button class="back" id="back">← Back to ${esc(s.name)}</button><div class="detail"><div class="eyebrow">${esc(s.name)} / Archive entry</div><h1>${esc(e.name)}</h1><p class="lead">${esc(e.subtitle)}</p><span class="tag">${esc(e.status)}</span>${e.spoiler&&!spoilers?`<div class="notice"><strong>Major story spoilers ahead</strong><p>This entry reveals the intended conclusion and cosmology of Resonance. Continue only if you want to know the planned ending.</p><button id="reveal">Reveal ending details</button></div>`:`<div class="card" style="margin-top:25px"><p>${esc(e.body)}</p></div>`}</div>`}else{let matches=s.entries.map((e,i)=>({...e,i})).filter(e=>(e.name+' '+e.subtitle+' '+e.body).toLowerCase().includes(query.toLowerCase()));html=`<div class="eyebrow">Resonance archive</div><h1>${esc(s.name)}</h1><p class="lead">${esc(s.description)}</p><input id="search" type="search" placeholder="Search this section…" value="${esc(query)}" aria-label="Search entries"><div class="grid">${matches.map(e=>card(e,e.i)).join('')||'<p>No entries found.</p>'}</div>`}}$('#main').innerHTML=html;document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{section=e.dataset.go;render();window.scrollTo(0,0)});document.querySelectorAll('[data-entry]').forEach(e=>e.onclick=()=>{detail=+e.dataset.entry;spoilers=false;render();window.scrollTo(0,0)});if($('#back'))$('#back').onclick=()=>{detail=null;render()};if($('#reveal'))$('#reveal').onclick=()=>{spoilers=true;render()};if($('#search')){$('#search').oninput=e=>{let p=e.target.selectionStart;query=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(p,p)}}}render();
</script></body></html>
